{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="bg-danger-subtle text-danger d-inline-flex p-4 rounded-circle mb-4 mx-auto">
                <i class="bi bi-gear-wide-connected fs-1"></i>
            </div>
            <h1 class="fw-bold display-5 text-danger">500</h1>
            <h4 class="fw-bold mb-2">Internal Server Error</h4>
            <p class="text-muted mb-4">
                An unexpected condition was encountered while processing the request. This issue has been logged.
            </p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

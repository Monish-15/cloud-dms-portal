{% extends "base.html" %}

{% block title %}Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="bg-secondary-subtle text-secondary d-inline-flex p-4 rounded-circle mb-4 mx-auto">
                <i class="bi bi-search fs-1"></i>
            </div>
            <h1 class="fw-bold display-5 text-secondary">404</h1>
            <h4 class="fw-bold mb-2">Resource Not Found</h4>
            <p class="text-muted mb-4">
                The requested document, route, or resource could not be found or has been permanently removed.
            </p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Unauthorized (401){% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="bg-warning-subtle text-warning d-inline-flex p-4 rounded-circle mb-4 mx-auto">
                <i class="bi bi-person-lock fs-1"></i>
            </div>
            <h1 class="fw-bold display-5 text-warning">401</h1>
            <h4 class="fw-bold mb-2">Authentication Required</h4>
            <p class="text-muted mb-4">
                You must be logged in with a valid user session to access this portal endpoint.
            </p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary-custom">Proceed to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

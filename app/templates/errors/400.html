{% extends "base.html" %}

{% block title %}Bad Request (400){% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="bg-warning-subtle text-warning d-inline-flex p-4 rounded-circle mb-4 mx-auto">
                <i class="bi bi-exclamation-diamond fs-1"></i>
            </div>
            <h1 class="fw-bold display-5 text-warning">400</h1>
            <h4 class="fw-bold mb-2">Invalid or Malformed Request</h4>
            <p class="text-muted mb-4">
                The request could not be processed due to invalid parameters or CSRF security token expiration.
            </p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
